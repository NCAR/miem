name: Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Best-effort and non-blocking (continue-on-error): netCDF on Windows is
  # supplied via vcpkg (preinstalled on the runner). MICM's Windows jobs are
  # likewise continue-on-error. Promote to a required check once proven stable.
  msvc2022:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        architecture: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Install netCDF (vcpkg)
        run: vcpkg install netcdf-c:x64-windows

      - name: Run CMake
        run: >
          cmake -S . -B build
          -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -A ${{ matrix.architecture }}
          -D MIEM_ENABLE_TESTS=ON
          -D CMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 10

      - name: Test
        run: cd build ; ctest -j 10 -C ${{ matrix.build_type }} --output-on-failure
